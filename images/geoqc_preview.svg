<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="800" height="500" fill="#003049"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="64" fill="#004b6b"/>
  <text x="24" y="26" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.5">GeoQC Flow</text>
  <text x="24" y="44" fill="#ffc300" font-size="10" font-weight="600" letter-spacing="1">PIPELINE QUALITY CONTROL REPORT</text>
  <text x="680" y="35" fill="#7aadcc" font-size="9">QA_pipeline · 6 steps</text>

  <!-- Metric cards row -->
  <!-- Card 1 -->
  <rect x="24" y="82" width="138" height="70" rx="5" fill="#004060"/>
  <text x="93" y="115" fill="#ffc300" font-size="22" font-weight="700" text-anchor="middle">6</text>
  <text x="93" y="134" fill="#7aadcc" font-size="9" letter-spacing="0.8" text-anchor="middle">STEPS COMPARED</text>

  <!-- Card 2 -->
  <rect x="172" y="82" width="138" height="70" rx="5" fill="#004060"/>
  <text x="241" y="115" fill="#ffc300" font-size="22" font-weight="700" text-anchor="middle">14</text>
  <text x="241" y="134" fill="#7aadcc" font-size="9" letter-spacing="0.8" text-anchor="middle">LAYERS ANALYSED</text>

  <!-- Card 3 -->
  <rect x="320" y="82" width="138" height="70" rx="5" fill="#004060"/>
  <text x="389" y="115" fill="#ffc300" font-size="22" font-weight="700" text-anchor="middle">1 248</text>
  <text x="389" y="134" fill="#7aadcc" font-size="9" letter-spacing="0.8" text-anchor="middle">ATTRIBUTE CHANGES</text>

  <!-- Card 4 -->
  <rect x="468" y="82" width="138" height="70" rx="5" fill="#004060"/>
  <text x="537" y="115" fill="#ffc300" font-size="22" font-weight="700" text-anchor="middle">312</text>
  <text x="537" y="134" fill="#7aadcc" font-size="9" letter-spacing="0.8" text-anchor="middle">GEOMETRY EDITS</text>

  <!-- Card 5 -->
  <rect x="616" y="82" width="160" height="70" rx="5" fill="#004060"/>
  <text x="696" y="115" fill="#ffc300" font-size="22" font-weight="700" text-anchor="middle">8</text>
  <text x="696" y="134" fill="#7aadcc" font-size="9" letter-spacing="0.8" text-anchor="middle">SMART REMARKS</text>

  <!-- Section label: Attribute changes per step -->
  <text x="24" y="178" fill="#7aadcc" font-size="9" font-weight="700" letter-spacing="1">ATTRIBUTE CHANGES PER STEP</text>

  <!-- Bar chart: attribute changes -->
  <!-- Step labels -->
  <text x="60"  y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">1→2</text>
  <text x="138" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">2→3</text>
  <text x="216" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">3→4</text>
  <text x="294" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">4→5</text>
  <text x="372" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">5→6</text>

  <!-- Bars (attr) -->
  <rect x="36"  y="218" width="48" height="55" rx="3" fill="#ffc300" opacity="0.85"/>
  <rect x="114" y="190" width="48" height="83" rx="3" fill="#ffc300" opacity="0.85"/>
  <rect x="192" y="235" width="48" height="38" rx="3" fill="#ffc300" opacity="0.85"/>
  <rect x="270" y="205" width="48" height="68" rx="3" fill="#ffc300" opacity="0.85"/>
  <rect x="348" y="248" width="48" height="25" rx="3" fill="#ffc300" opacity="0.85"/>

  <!-- Section label: Geometry severity -->
  <text x="430" y="178" fill="#7aadcc" font-size="9" font-weight="700" letter-spacing="1">GEOMETRY SEVERITY PER STEP</text>

  <!-- Severity bars -->
  <text x="475" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">1→2</text>
  <text x="543" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">2→3</text>
  <text x="611" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">3→4</text>
  <text x="679" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">4→5</text>
  <text x="747" y="278" fill="#5a8fa8" font-size="8" text-anchor="middle">5→6</text>

  <rect x="451" y="240" width="48" height="33" rx="3" fill="#2dc653" opacity="0.9"/>
  <rect x="519" y="193" width="48" height="80" rx="3" fill="#dc3545" opacity="0.9"/>
  <rect x="587" y="220" width="48" height="53" rx="3" fill="#fd7e14" opacity="0.9"/>
  <rect x="655" y="248" width="48" height="25" rx="3" fill="#ffc300" opacity="0.9"/>
  <rect x="723" y="255" width="48" height="18" rx="3" fill="#2dc653" opacity="0.9"/>

  <!-- Divider -->
  <line x1="24" y1="296" x2="776" y2="296" stroke="#004b6b" stroke-width="1"/>

  <!-- Smart Remarks panel -->
  <text x="24" y="316" fill="#7aadcc" font-size="9" font-weight="700" letter-spacing="1">SMART REMARKS</text>

  <!-- Alert remark -->
  <rect x="24" y="325" width="752" height="36" rx="4" fill="#1a0a0c"/>
  <rect x="24" y="325" width="4"   height="36" rx="2" fill="#dc3545"/>
  <text x="36" y="340" fill="#dc3545" font-size="10">⚠</text>
  <text x="52" y="340" fill="#e8c8cc" font-size="9"><tspan font-weight="700">2-QA → 3-IC: </tspan>MAJOR geometry severity — 312 real geometry edits (28.5% of features). Detailed review recommended.</text>
  <text x="36" y="354" fill="#8896b8" font-size="8">ALERT · Geometry</text>

  <!-- Warning remark -->
  <rect x="24" y="368" width="752" height="36" rx="4" fill="#120d04"/>
  <rect x="24" y="368" width="4"   height="36" rx="2" fill="#fd7e14"/>
  <text x="36" y="383" fill="#fd7e14" font-size="10">●</text>
  <text x="52" y="383" fill="#e8d5c0" font-size="9"><tspan font-weight="700">4-IC → 5-Final: </tspan>Feature count change of +14% in CableLine layer. Possible splits or additions detected.</text>
  <text x="36" y="397" fill="#8896b8" font-size="8">WARNING · Feature Count</text>

  <!-- Info remark -->
  <rect x="24" y="411" width="752" height="36" rx="4" fill="#04090f"/>
  <rect x="24" y="411" width="4"   height="36" rx="2" fill="#2d7dd2"/>
  <text x="36" y="426" fill="#2d7dd2" font-size="10">ℹ</text>
  <text x="52" y="426" fill="#c0d0e8" font-size="9"><tspan font-weight="700">Pipeline-wide: </tspan>StructurePoint drives 31% of all attribute changes. Busiest layer across all steps.</text>
  <text x="36" y="440" fill="#8896b8" font-size="8">INFO · Top Layer</text>

  <!-- Severity legend bottom -->
  <text x="24" y="468" fill="#5a8fa8" font-size="8">SEVERITY:</text>
  <rect x="75"  y="458" width="8" height="8" rx="2" fill="#adb5bd"/>
  <text x="86"  y="467" fill="#5a8fa8" font-size="8">NONE</text>
  <rect x="123" y="458" width="8" height="8" rx="2" fill="#2dc653"/>
  <text x="134" y="467" fill="#5a8fa8" font-size="8">STABLE</text>
  <rect x="178" y="458" width="8" height="8" rx="2" fill="#ffc300"/>
  <text x="189" y="467" fill="#5a8fa8" font-size="8">LIGHT</text>
  <rect x="227" y="458" width="8" height="8" rx="2" fill="#fd7e14"/>
  <text x="238" y="467" fill="#5a8fa8" font-size="8">MODERATE</text>
  <rect x="297" y="458" width="8" height="8" rx="2" fill="#dc3545"/>
  <text x="308" y="467" fill="#5a8fa8" font-size="8">MAJOR</text>

</svg>
